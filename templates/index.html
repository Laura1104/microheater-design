<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Microheater Design – Automated Microheater Design</title>
<meta name="description" content="Diseño y optimización de microcalentadores con Machine Learning.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&display=swap">

<!-- Tailwind y FontAwesome -->
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
body{margin:0;background:#FFFFFF}
html{scroll-behavior:smooth}
section{scroll-margin-top:72px}
a{color:#2E58A6}a:hover{color:#284269}
.bp{background-color:#FFFFFF;background-image:linear-gradient(rgba(40,66,105,0.05) 1px,transparent 1px),linear-gradient(90deg,rgba(40,66,105,0.05) 1px,transparent 1px);background-size:32px 32px}
.mh-in:focus-visible{outline:3px solid #2E58A6;outline-offset:2px}
.mh-field:focus-within{outline:3px solid #2E58A6;outline-offset:2px}
.mh-btn:hover{filter:brightness(1.1)}
.mh-nav:hover{color:#284269;background:#EEF3FA}
.mh-icon:hover{background:#EEF3FA}
.mh-exp:hover{background:rgba(255,255,255,0.12)}
.mh-team{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.mh-sec{padding-top:104px;padding-bottom:104px}
@media (max-width:900px){.mh-team{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px} }
@media (max-width:640px){.mh-hide-sm{display:none !important}.mh-sec{padding-top:64px;padding-bottom:64px} }

/* Animaciones del profesor (React Bits style) */
@keyframes mhBlurIn { from { opacity: 0; filter: blur(12px); transform: translateY(-14px); } to { opacity: 1; filter: blur(0); transform: none; } }
.mh-blur { display: inline-block; animation: mhBlurIn 0.8s cubic-bezier(.2,.7,.2,1) both; }
@keyframes mhReveal { from { opacity: 0.15; filter: blur(6px); } to { opacity: 1; filter: blur(0); } }
@keyframes mhSlide { from { opacity: 0; transform: translateY(14px) scale(0.98); } to { opacity: 1; transform: none; } }

/* Star Border */
.mh-star{position:relative;border-radius:16px;padding:1.5px;overflow:hidden;background:#CBD5E1;box-shadow:0 1px 2px rgba(15,23,42,0.06),0 10px 28px rgba(40,66,105,0.08)}
.mh-star::before,.mh-star::after{content:"";position:absolute;width:300%;height:50%;border-radius:50%;opacity:0.9;z-index:0}
.mh-star::before{bottom:-11px;right:-250%;background:radial-gradient(circle,#2E58A6,transparent 10%);animation:mhStarB 5s linear infinite alternate}
.mh-star::after{top:-10px;left:-250%;background:radial-gradient(circle,#2E58A6,transparent 10%);animation:mhStarT 5s linear infinite alternate}
@keyframes mhStarB{0%{transform:translate(0%,0%);opacity:1}100%{transform:translate(-100%,0%);opacity:0} }
@keyframes mhStarT{0%{transform:translate(0%,0%);opacity:1}100%{transform:translate(100%,0%);opacity:0} }

.mh-spot{background-color:#284269;background-image:radial-gradient(380px circle at var(--mx,72%) var(--my,26%),rgba(94,134,201,0.45),transparent 62%)}
.mh-bento{transition:border-color .25s,box-shadow .25s,transform .25s}
.mh-bento:hover{transform:translateY(-3px);box-shadow:0 16px 36px rgba(40,66,105,0.14)}
.mh-bento-light{background-color:#FFFFFF;border:1px solid #DCE3EE}
.mh-spin{animation:mhSpin 16s linear infinite}
@keyframes mhSpin{to{transform:rotate(360deg)} }

/* Design process animation styles */
.process-step, .process-arrow, .adjust-process { opacity: 0; }
.process-step { transform: translateX(-20px); }
.adjust-process { transform: translateY(10px); }
.why-visible .process-step { animation: processIn 0.7s ease-out forwards; }
.why-visible .process-step.define { animation-delay: 0.2s; }
.why-visible .process-step.evaluate { animation-delay: 0.7s; }
.why-visible .process-step.compare { animation-delay: 1.2s; }
/* Flechas del proceso */
.why-visible .process-arrow {
    animation: arrowIn 0.5s ease-out forwards;
}

.why-visible .process-arrow.first {
    animation-delay: 0.5s;
}

.why-visible .process-arrow.second {
    animation-delay: 1s;
}
.why-visible .why-visible .adjust-process { animation: adjustIn 0.6s ease-out forwards; animation-delay: 1.7s; }
@keyframes processIn { to { opacity: 1; transform: translateX(0); } }
@keyframes arrowIn { to { opacity: 1; } }
@keyframes adjustIn { to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<div id="app"></div>

<template id="xdc">
{% raw %}
<div style="width: 100%; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #334155; background: #FFFFFF; line-height: 1.5">

<!-- Barra Superior -->
<div style="background: #284269; color: #FFFFFF; font-family: 'IBM Plex Mono', monospace; font-size: 13px; text-align: center; padding: 9px 16px">
    {{t.announce}} <a class="mh-link" href="#" style="color: #FFFFFF; font-weight: 600">{{t.announceLink}}</a>
</div>

<!-- Header -->
<header style="position: sticky; top: 0; z-index: 10; background: rgba(255,255,255,0.96); border-bottom: 1px solid #DCE3EE">
<div style="max-width: 1200px; margin: 0 auto; padding: 12px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px">
    <a href="#home" class="mh-link" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #284269; flex-grow: 1; min-height: 44px">
        <svg width="26" height="26" viewBox="0 0 28 28" fill="none" stroke="#2E58A6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 24V5h4.5v18H14V5h4.5v18H23V4"></path></svg>
        <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 19px">Microheater Design</span>
    </a>
    <nav class="mh-hide-sm" style="display: flex; flex-wrap: wrap; gap: 2px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em">
        <a href="#why" class="mh-link mh-nav" style="padding: 12px 10px; border-radius: 6px; text-decoration: none; color: #334155">[01] {{t.nav0}}</a>
        <a href="#designer" class="mh-link mh-nav" style="padding: 12px 10px; border-radius: 6px; text-decoration: none; color: #334155">[02] {{t.nav1}}</a>
        <a href="#team" class="mh-link mh-nav" style="padding: 12px 10px; border-radius: 6px; text-decoration: none; color: #334155">[03] {{t.nav2}}</a>
    </nav>
    <div style="display: flex; border: 1px solid #CBD5E1; border-radius: 8px; padding: 3px">
        <button style="{{enStyle}}" onClick="{{setEn}}">EN</button>
        <button style="{{esStyle}}" onClick="{{setEs}}">ES</button>
    </div>
    <!-- Logo Universidad de los Andes -->
    <div style="display: flex; align-items: center; margin-left: 12px;">
        <img src="/static/images/ibio.png" alt="Universidad de los Andes" style="height: 3.5rem; width: auto; object-fit: contain;">
    </div>
</div>
</header>

<!-- Hero Section (Aquí es donde van "los punticos" interactivos con el canvas) -->
<section id="home" onMouseMove="{{heroMove}}" onMouseLeave="{{heroLeave}}" style="position: relative; overflow: hidden; background: #FFFFFF; border-bottom: 1px solid #DCE3EE">
<canvas ref="{{setDotCanvas}}" aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none"></canvas>
<div style="position: relative; max-width: 1200px; margin: 0 auto; padding: 72px 24px 88px; display: flex; flex-wrap: wrap; align-items: center; gap: 48px">
<div style="flex: 1 1 500px; min-width: 0">
    <p style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #2E58A6"><span>{{dec}}</span></p>
    <h1 style="margin: 20px 0 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(48px, 6.4vw, 84px); line-height: 1; letter-spacing: -0.035em; font-weight: 700; color: #284269">
        <span class="mh-blur">{{t.h1a}}</span><br><span class="mh-blur" style="color: #2E58A6">{{t.h1b}}</span><br><span class="mh-blur">{{t.h1c}}</span>
    </h1>
    <p style="margin: 24px 0 0; max-width: 520px; font-size: 19px; color: #334155">{{t.sub}}</p>
</div>

<!-- AQUÍ VA EL REEMPLAZO DE LA FIGURA -->
<figure 
    class="mh-spot" 
    onmousemove="const r=this.getBoundingClientRect();this.style.setProperty('--mx',(event.clientX-r.left)+'px');this.style.setProperty('--my',(event.clientY-r.top)+'px');"
    style="position: relative; overflow: hidden; flex: 1 1 400px; min-width: 0; margin: 0; border-radius: 18px; padding: 24px 24px 20px; color: #FFFFFF; background: #132238; border: 1px solid rgba(147, 180, 237, 0.18); box-shadow: 0 20px 50px rgba(40,66,105,0.22); --mx: 50%; --my: 50%;"
>
    <style>
        .mh-spot::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(
                360px circle at var(--mx) var(--my),
                rgba(116, 165, 255, 0.25),
                rgba(64, 114, 204, 0.08) 45%,
                transparent 75%
            );
            opacity: 0;
            transition: opacity 0.35s ease;
            z-index: 1;
        }
        .mh-spot:hover::before {
            opacity: 1;
        }
        #mhIsoCanvas {
            transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .mh-spot:hover #mhIsoCanvas {
            transform: translateY(-4px);
        }
    </style>


    <!-- Contenedor con Canvas -->
    <div style="position: relative; z-index: 2; width: 100%; max-width: 460px; height: 350px; margin: 4px auto 0; display: flex; align-items: center; justify-content: center;">
        <canvas id="mhIsoCanvas" width="720" height="580" style="width: 100%; height: 100%; display: block;"></canvas>
    </div>

</figure>

<script>
(function() {
    function drawMicroheater() {
        const c = document.getElementById('mhIsoCanvas');
        if (!c || !c.getContext) return;
        const ctx = c.getContext('2d');
        
        // Escala base 360x290 dibujada en resolución 2x (720x580) para máxima nitidez
        ctx.clearRect(0, 0, c.width, c.height);
        ctx.save();
        ctx.scale(2, 2);

        const tracePoints = [
            [108, 103], [72, 123], [164, 176], [176, 169],
            [94, 122],  [106, 115], [188, 162], [200, 155],
            [118, 108], [130, 101], [212, 148], [224, 141],
            [142, 94],  [154, 87],  [236, 134], [248, 127],
            [166, 80],  [178, 73],  [260, 120], [272, 113],
            [184, 62],  [144, 84]
        ];

        function tracePath() {
            ctx.beginPath();
            ctx.moveTo(tracePoints[0][0], tracePoints[0][1]);
            for (let i = 1; i < tracePoints.length; i++) {
                ctx.lineTo(tracePoints[i][0], tracePoints[i][1]);
            }
        }

        function drawPoly(pts, fill, stroke, lineWidth = 1) {
            ctx.beginPath();
            ctx.moveTo(pts[0][0], pts[0][1]);
            for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
            ctx.closePath();
            if (fill) { ctx.fillStyle = fill; ctx.fill(); }
            if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lineWidth; ctx.stroke(); }
        }

        // 1. BLOQUE ISOMÉTRICO 3D (Sustrato)
        const topGrad = ctx.createLinearGradient(28, 32, 332, 204);
        topGrad.addColorStop(0, 'rgba(35, 60, 97, 0.78)');
        topGrad.addColorStop(1, 'rgba(23, 42, 70, 0.45)');

        const leftGrad = ctx.createLinearGradient(28, 118, 28, 226);
        leftGrad.addColorStop(0, 'rgba(45, 76, 122, 0.65)');
        leftGrad.addColorStop(1, 'rgba(20, 35, 58, 0.85)');

        // Cara superior
        drawPoly([[180,32], [332,114], [166,204], [28,118]], topGrad, '#567BB0', 1);
        // Cara frontal izquierda
        drawPoly([[28,118], [166,204], [166,226], [28,140]], leftGrad, '#567BB0', 1);
        // Cara frontal derecha
        drawPoly([[166,204], [332,114], [332,136], [166,226]], 'rgba(25, 45, 75, 0.85)', '#567BB0', 1);

        // Aristas internas posteriores punteadas (efecto transparente)
        ctx.save();
        ctx.setLineDash([3, 3]);
        ctx.strokeStyle = 'rgba(77, 110, 158, 0.35)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(28, 140);
        ctx.lineTo(180, 54);
        ctx.lineTo(332, 136);
        ctx.moveTo(180, 32);
        ctx.lineTo(180, 54);
        ctx.stroke();
        ctx.restore();

        // 2. ISOTERMAS CONCÉNTRICAS EN EL PLANO
        const isotherms = [
            [[180,44], [312,115], [166,193], [48,119]],
            [[180,56], [292,116], [166,182], [68,120]],
            [[180,68], [272,117], [166,171], [88,121]],
            [[180,80], [252,118], [166,160], [108,122]]
        ];
        isotherms.forEach(pts => drawPoly(pts, null, 'rgba(147, 180, 237, 0.18)', 0.9));

        // 3. SERPENTÍN CON RESPLANDOR TÉRMICO
        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        // Halo difuso exterior
        ctx.shadowColor = 'rgba(94, 134, 201, 0.95)';
        ctx.shadowBlur = 18;
        ctx.strokeStyle = 'rgba(94, 134, 201, 0.55)';
        ctx.lineWidth = 9;
        tracePath();
        ctx.stroke();

        // Halo medio
        ctx.shadowBlur = 6;
        ctx.strokeStyle = 'rgba(139, 168, 209, 0.85)';
        ctx.lineWidth = 4;
        tracePath();
        ctx.stroke();

        // Núcleo blanco brillante
        ctx.shadowBlur = 2;
        ctx.shadowColor = '#FFFFFF';
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 1.9;
        tracePath();
        ctx.stroke();
        ctx.restore();

        // 4. PADS DE CONTACTO ISOMÉTRICOS
        drawPoly([[109,92], [123,100], [109,108], [95,100]], '#C9D7EE', '#FFFFFF', 0.8);
        drawPoly([[139,75], [153,83], [139,91], [125,83]], '#C9D7EE', '#FFFFFF', 0.8);

        // 5. COTAS TÉCNICAS
        ctx.strokeStyle = 'rgba(139, 168, 209, 0.85)';
        ctx.lineWidth = 0.9;
        ctx.beginPath();
        // Izquierda (35.0 mm)
        ctx.moveTo(22, 147); ctx.lineTo(160, 233);
        ctx.moveTo(18, 151); ctx.lineTo(26, 143);
        ctx.moveTo(156, 237); ctx.lineTo(164, 229);
        // Derecha (30.0 mm)
        ctx.moveTo(174, 233); ctx.lineTo(336, 144);
        ctx.moveTo(170, 229); ctx.lineTo(178, 237);
        ctx.moveTo(332, 140); ctx.lineTo(340, 148);
        ctx.stroke();

        // Textos de las cotas
        ctx.fillStyle = '#C9D7EE';
        ctx.font = '10px "IBM Plex Mono", monospace';
        ctx.textAlign = 'center';

        ctx.save();
        ctx.translate(80, 204);
        ctx.rotate(31 * Math.PI / 180);
        ctx.fillText('20.0 mm', 0, 0);
        ctx.restore();

        ctx.save();
        ctx.translate(266, 202);
        ctx.rotate(-29 * Math.PI / 180);
        ctx.fillText('30.0 mm', 0, 0);
        ctx.restore();

        ctx.restore();
    }

    // Ejecutar inmediatamente y reintentar brevemente por si el DOM carga asíncrono
    drawMicroheater();
    setTimeout(drawMicroheater, 150);
})();
</script>
</div>
</section>

<!-- Why Section -->
<section id="why" class="mh-sec" style="background: #F5F7FB; font-family: 'IBM Plex Sans', sans-serif;">

    <style>
        /* Typography */
        #why h2,
        #why h3 {
            font-family: 'Space Grotesk', sans-serif;
        }

        #why .why-eyebrow,
        #why .why-card-label,
        #why .why-number,
        #why .why-footer,
        #why .why-ring-text {
            font-family: 'IBM Plex Mono', monospace;
        }

        /* Main title animation */
        #why .why-title {
            animation: mhReveal 0.8s cubic-bezier(.2,.7,.2,1) both;
        }

        #why .why-lead {
            animation: mhReveal 0.8s cubic-bezier(.2,.7,.2,1) both;
            animation-delay: 0.15s;
        }

        /* Cards */
        #why .mh-bento {
            --mx: 50%;
            --my: 50%;
            position: relative;
            overflow: hidden;
            border-radius: 16px;
            padding: 32px;
            transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
        }

        #why .mh-bento-light {
            background: #FFFFFF;
            border: 1px solid #DCE3EE;
            color: #334155;
            box-shadow: 0 10px 28px rgba(40,66,105,0.06);
        }

        #why .mh-bento-light::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0;
            transition: opacity .25s ease;
            background: radial-gradient(280px circle at var(--mx) var(--my), rgba(46,88,166,0.09), transparent 70%);
        }

        #why .mh-bento-light:hover {
            transform: translateY(-4px);
            border-color: #B8C7DF;
            box-shadow: 0 20px 42px rgba(40,66,105,0.14);
        }

        #why .mh-bento-light:hover::before {
            opacity: 1;
        }

        #why .mh-bento-navy {
            background: #284269;
            border: 1px solid #284269;
            color: #FFFFFF;
            box-shadow: 0 12px 30px rgba(40,66,105,0.16);
        }

        #why .mh-bento-navy::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0;
            transition: opacity .25s ease;
            background: radial-gradient(300px circle at var(--mx) var(--my), rgba(147,180,237,0.22), transparent 70%);
        }

        #why .mh-bento-navy:hover {
            transform: translateY(-4px);
            border-color: #4A73B5;
            box-shadow: 0 22px 46px rgba(15,23,42,0.28), 0 0 0 1px rgba(147,180,237,0.28);
        }

        #why .mh-bento-navy:hover::before {
            opacity: 1;
        }

        /* Circular rotating text & arrow */
        #why .why-spin {
            animation: mhSpin 16s linear infinite;
            transform-box: fill-box;
            transform-origin: center;
        }

        #why .why-ring-text {
            font-size: 7.5px;
            font-weight: 600;
            letter-spacing: 0.14em;
            fill: #64748B;
        }

        /* Traditional process list */
        #why .why-loop-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 12px;
            margin: 0 -12px;
            border-radius: 10px;
            border-bottom: 1px dashed #CBD5E1;
            font-size: 16px;
            color: #334155;
            transition: background-color .2s ease, transform .2s ease, color .2s ease;
        }

        #why .why-loop-item:last-child {
            border-bottom: none;
        }

        #why .why-loop-item:hover {
            background: #F1F5FB;
            color: #284269;
            transform: translateX(4px);
        }

        /* Microheater Design steps */
        #why .why-tool-step {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 13px 14px;
            border-radius: 10px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.16);
            font-size: 16px;
            color: #FFFFFF;
            animation: mhSlide 0.6s cubic-bezier(.2,.7,.2,1) both;
            transition: background-color .2s ease, border-color .2s ease, transform .2s ease;
        }

        #why .why-tool-step:hover {
            background: rgba(255,255,255,0.16);
            border-color: rgba(201,215,238,0.45);
            transform: translateX(4px);
        }

        #why .why-tool-step:nth-child(1) {
            animation-delay: 0.25s;
        }

        #why .why-tool-step:nth-child(2) {
            animation-delay: 0.40s;
        }

        #why .why-tool-step:nth-child(3) {
            animation-delay: 0.55s;
        }

        #why .why-step-number {
            width: 32px;
            height: 32px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            background: #FFFFFF;
            color: #284269;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            font-weight: 600;
        }

        /* Responsive adjustments */
        @media (max-width: 640px) {
            #why .mh-bento {
                padding: 24px;
            }

            #why .why-card-header {
                gap: 8px;
            }

            #why .why-title {
                font-size: clamp(34px, 9vw, 46px) !important;
            }
        }

        /* Accessibility: respect reduced motion preferences */
        @media (prefers-reduced-motion: reduce) {
            #why *,
            #why *::before,
            #why *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>

    <div style="max-width: 1200px; margin: 0 auto; padding: 0 24px;">

        <!-- Section heading -->
        <p class="why-eyebrow" style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #2E58A6;">
            [01] {{t.whyEyebrow}}
        </p>

        <div style="margin-top: 18px; display: flex; flex-wrap: wrap; gap: 20px 64px; align-items: flex-end;">

            <h2 class="why-title" style="flex: 1 1 480px; margin: 0; font-size: clamp(36px, 4.4vw, 56px); line-height: 1.06; letter-spacing: -0.035em; font-weight: 700; color: #284269;">
                {{t.whyTitle}}
            </h2>

            <p class="why-lead" style="flex: 1 1 340px; margin: 0; font-size: 17px; line-height: 1.7; color: #5B6B82;">
                {{t.whyLead}}
            </p>

        </div>

        <!-- Comparison cards -->
        <div style="margin-top: 56px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 20px;">

            <!-- Traditional trial and error -->
            <div class="mh-bento mh-bento-light" onmousemove="const r=this.getBoundingClientRect();this.style.setProperty('--mx',(event.clientX-r.left)+'px');this.style.setProperty('--my',(event.clientY-r.top)+'px');">

<script>
(function () {
  class DCLogic {
    constructor(props) { this.props = props || {}; this.state = {}; }
    setState(p) { const prev = this.state; this.state = Object.assign({}, prev, typeof p === 'function' ? p(prev, this.props) : p); schedule(prev); }
  }
  window.DCLogic = DCLogic;

  let inst = null, tpl = null, root = null, pending = false;
  function schedule(prev) {
    if (pending) return;
    pending = true;
    queueMicrotask(() => { pending = false; update(); });
  }

  const lookup = (path, scope) => {
    path = path.trim();
    if (path === 'true') return true; if (path === 'false') return false;
    let v = scope;
    for (const p of path.split('.')) { if (v == null) return undefined; v = v[p]; }
    return v;
  }
  const interp = (str, scope) => str.replace(/\{\{\s*([^}]+?)\s*\}\}/g, (m, p) => { const v = lookup(p, scope); return v == null ? '' : String(v); });

  function build(n, scope, parent) {
    if (n.nodeType === 3) { parent.appendChild(document.createTextNode(interp(n.nodeValue, scope))); return; }
    if (n.nodeType !== 1) return;
    const tag = n.localName;
    if (tag === 'sc-for') {
      const list = lookup(n.getAttribute('list'), scope) || [];
      const as = n.getAttribute('as') || 'item';
      list.forEach((it, i) => { const s = Object.create(scope); s[as] = it; s.$index = i; n.childNodes.forEach((c) => build(c, s, parent)); });
      return;
    }
    const el = document.createElement(tag);
    for (const a of n.attributes) {
      const m = a.value.match(/^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/);
      if (m) {
        const v = lookup(m[1], scope);
        if (a.name === 'ref' && typeof v === 'function') { el.__ref = v; continue; }
        if (a.name.startsWith('on') && typeof v === 'function') {
          let ev = a.name.slice(2).toLowerCase(); if (ev === 'change') ev = 'input';
          el.addEventListener(ev, v); continue;
        }
        if (v != null) el.setAttribute(a.name, String(v));
      } else el.setAttribute(a.name, interp(a.value, scope));
    }
    n.childNodes.forEach((c) => build(c, scope, el));
    parent.appendChild(el);
  }

  function callRefs() {
    const walk = (node, fn) => { if (node.nodeType === 1) { fn(node); node.childNodes.forEach(c => walk(c, fn)); } };
    walk(root, (el) => { if (el.__ref) el.__ref(el); });
  }

  function fresh() {
    const frag = document.createDocumentFragment();
    const vals = inst.renderVals();
    tpl.content.childNodes.forEach((c) => build(c, vals, frag));
    return frag;
  }
  function update() { root.innerHTML = ''; root.appendChild(fresh()); callRefs(); }

  window.mountDC = function (Component) {
    tpl = document.getElementById('xdc');
    root = document.getElementById('app');
    inst = new Component({});
    update();
    if (inst.componentDidMount) inst.componentDidMount();
  };
})();

decrypt() {

      .map((c, k) => (k < i || c === ' ' || c === '[' || c === ']') ? c : chars[Math.floor(Math.random() * chars.length)])

async function generarYDescargar(formato) {
    const tempElem = document.getElementById('temp_target');
    const xElem = document.getElementById('x_length');
    const yElem = document.getElementById('y_length');
    const estrategiaElem = document.getElementById('estrategia');

    const progressBox = document.getElementById('download-progress-box');
    const progressBar = document.getElementById('download-progress-bar');
    const statusText = document.getElementById('download-status-text');
    const percentText = document.getElementById('download-percent-text');

    const currentValueText = document.getElementById('current-value-text');
    const currentMetaText = document.getElementById('current-meta-text');

    const data = {
        temp_target: tempElem ? parseFloat(tempElem.value) : 20.0,
        x_length: xElem ? parseFloat(xElem.value) : 30.0,
        y_length: yElem ? parseFloat(yElem.value) : 15.0,
        estrategia: estrategiaElem ? estrategiaElem.value : 'A'
    };

    // Mostrar barrita de carga
    let pct = 15;
    if (progressBox && progressBar && statusText && percentText) {
        progressBox.style.display = 'block';
        statusText.textContent = `Generating ${formato.toUpperCase()} & downloading...`;
        percentText.textContent = `${pct}%`;
        progressBar.style.width = `${pct}%`;
    }

    const timer = setInterval(() => {
        if (pct < 85) {
            pct += 10;
            if (progressBar && percentText) {
                progressBar.style.width = `${pct}%`;
                percentText.textContent = `${pct}%`;
            }
        }
    }, 160);

    try {
        const resp = await fetch(`/generar_${formato}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        const res = await resp.json();

        clearInterval(timer);

        if (resp.ok && res.status === 'ok') {
            if (progressBar && percentText && statusText) {
                progressBar.style.width = '100%';
                percentText.textContent = '100%';
                statusText.textContent = 'Download ready!';
            }

            // Mostrar corriente predicha desde Flask (en Amperios, como en resolver_inverso)
            if (currentValueText && currentMetaText) {
                if (res.corriente !== undefined && res.corriente !== null && !Number.isNaN(Number(res.corriente))) {
                    const corrienteA = Number(res.corriente);
                    const corrienteMA = (corrienteA * 1000).toFixed(1);
                    currentValueText.textContent = `${corrienteA.toFixed(3)} A (${corrienteMA} mA)`;
                } else {
                    currentValueText.textContent = 'N/A';
                }

                const tempInfo = res.temperatura_lograda !== undefined ? ` · Pred: ${res.temperatura_lograda} °C` : '';
                currentMetaText.textContent = `Strategy ${data.estrategia} · Target ${data.temp_target} °C${tempInfo}`;
            }

            if (res.descarga_url) {
                window.location.href = res.descarga_url;
            }
        } else {
            if (statusText) statusText.textContent = 'Error generating file';
            alert('Error: ' + (res.mensaje || 'No se pudo generar el archivo.'));
        }
    } catch (err) {
        clearInterval(timer);
        console.error(err);
        if (statusText) statusText.textContent = 'Connection error';
        alert('Error de conexión con Flask.');
    }
}
</script>

</body>
</html>
